apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-stable
  namespace: aceest-devops
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-app
      release: stable
  template:
    metadata:
      labels:
        app: aceest-app
        release: stable
    spec:
      containers:
        - name: aceest-app
          image: aceest-fitness-gym:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: stable
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: aceest-config
                  key: PORT
